<div class="experience-grid">{% for org in data.experience %}<article class="experience-row"><div><div class="organization-mark">{% if org.logo %}<img class="organization-logo" src="{{ url_for('static',filename=org.logo) }}" alt="{{ org.title }}" loading="lazy">{% endif %}</div><h3>{{ org.title }}</h3>{% if org.text %}<p>{{ org.text }}</p>{% endif %}</div></article>{% endfor %}</div>
